name: Verificacao Nortesys KB

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kb-verificacao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    name: Regras, lint, formatacao e tipos
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias reproduzivelmente
        run: npm ci
      - name: Verificar estrutura, documentos, seguranca e regras
        run: npm run verificar:regras
      - name: ESLint
        run: npm run lint
      - name: Formatacao basica
        run: npm run format:check
      - name: Cascata CSS sem seletores duplicados
        run: node scripts/auditar-css.mjs --check
      - name: TypeScript
        run: npm run typecheck
      - name: Descobrir os seis testes Playwright sem abrir navegador
        run: npm run testar:e2e:listar
      - name: Auditoria geral incluindo devDependencies (informativa)
        run: npm audit --audit-level=high --no-fund
        continue-on-error: true
      - name: Vulnerabilidades HIGH/CRITICAL nas dependencias de producao (bloqueante)
        run: npm audit --omit=dev --audit-level=high --no-fund

  segredos:
    name: Gitleaks no historico Git
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Varredura de segredos em push e PR
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
